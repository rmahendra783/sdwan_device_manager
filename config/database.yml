default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + ENV.fetch("SIDEKIQ_CONCURRENCY", 5).to_i %>
  username: postgres
  password: password
  host: localhost
  port: 5432

development:
  <<: *default
  database: sdwan_device_manager_development

test:
  <<: *default
  database: sdwan_device_manager_test

production:
  primary: &primary_production
    <<: *default
    database: sdwan_device_manager_production
    username: sdwan_device_manager
    password: <%= ENV["SDWAN_DEVICE_MANAGER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: sdwan_device_manager_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: sdwan_device_manager_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: sdwan_device_manager_production_cable
    migrations_paths: db/cable_migrate